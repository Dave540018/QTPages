            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bg-black\/30 {
            background-color: rgb(0 0 0 / 10%) !important;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .heart-particle {
            position: absolute;
            bottom: -10%;
            animation: float linear infinite;
            z-index: 0;
            pointer-events: none;
        }
    </style>

                </div>
                <p class="text-white text-lg leading-relaxed italic">
                    "Every day with you feels like a beautiful dream. I wanted to put together a few of our memories here to remind you how much you mean to me. Happy Valentine's Day!"

            <footer class="pt-6 border-t border-white/10 text-center">
                <button onclick="sharePage()" class="bg-white/20 hover:bg-white/30 text-white px-6 py-3 rounded-full font-semibold transition-all flex items-center gap-2 mx-auto">
                    <i data-lucide="share-2" class="w-5 h-5"></i> Share the Love
                </button>
            </footer>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Reveal card on load
        window.addEventListener('load', () => {
            const card = document.getElementById('main-card');
            card.classList.remove('opacity-0', 'translate-y-10');
        });

        // Floating Hearts Logic
        const container = document.getElementById('heart-container');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="white" opacity="${Math.random() * 0.5 + 0.2}"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 5 + 's';
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 8000);
        }
        setInterval(createHeart, 400);

        // Simple Share Function
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'A Valentine for You',
                    url: window.location.href
                });
            } else {
                alert("Copy the link in your browser to share!");
            }
        }
    </script>
</body>
</html>
